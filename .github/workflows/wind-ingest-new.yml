name: wind-ingest-newdb

on:
  schedule:
    - cron: "0 10 * * *"   # 10z: after every state's local day fully ends (PT/AZ end 07z) + URMA latency
    # Second daily pass (2026-08-27): self-heal sweep — re-runs any of the
    # last 3 days that ingested zero states (late URMA files or a skipped
    # morning run, e.g. the 2026-08-26 nationwide miss).
    - cron: "30 16 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Local date(s): YYYY-MM-DD, YYYYMMDD, START..END or a:b, comma lists (all hours required). Blank = yesterday (+ self-heal; deferred until every URMA hour is published)."
        required: false
      states:
        description: "Comma list of states. Blank = all permitted."
        required: false
      hours_step:
        description: "Hour stride for daily max (1=hourly/best, 3=faster backfill)."
        required: false
      dry_run:
        description: "1 = compute everything, write nothing (payload md5 + row counts in the summary/artifact)."
        required: false
      day_convention:
        description: "v3 (default, empty) or v4 (Phase 5 own-zone local days; dry-run first, owner OK before any write)"
        required: false

# One run at a time; a second trigger queues behind the first (never cancels it).
concurrency: {group: wind-ingest, cancel-in-progress: false}
jobs:
  ingest:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: System deps
        run: sudo apt-get update && sudo apt-get install -y libeccodes-dev
      - name: Python deps
        run: pip install -r requirements.txt
      - name: Run ingester
        env:
          SUPABASE_URL:      https://aozjsfjemobuzqrhxcxy.supabase.co
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFvempzZmplbW9idXpxcmh4Y3h5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ2NzMyODIsImV4cCI6MjEwMDI0OTI4Mn0.gYwwzMcT4VCuTyWHNXlm8viyeGOsv7isfNgegYAmcV8
          INGEST_SECRET:     ${{ secrets.INGEST_SECRET_NEW }}
          INGEST_DATE:       ${{ github.event.inputs.date }}
          STATES:            ${{ github.event.inputs.states }}
          HOURS_STEP:        ${{ github.event.inputs.hours_step }}
          DRY_RUN:           ${{ github.event.inputs.dry_run }}
          DAY_CONVENTION:    ${{ github.event.inputs.day_convention }}
          FEED_OUT_DIR:      feed-out
        run: python wind_ingest.py
      - name: Upload run record (summary JSON, quarantine records, dry-run payloads)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feed-out-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: feed-out
          if-no-files-found: ignore
          retention-days: 30
